<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <path id="innerCurve" d="M30 70 Q50 85, 70 70" fill="transparent" />

        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgb(27 40 56);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgb(27 40 56);stop-opacity:1" />
        </linearGradient>

        <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgb(27 40 56);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgb(27 40 56);stop-opacity:1" />
        </linearGradient>

        <linearGradient id="keyholeShade"
            x1="100" y1="130"
            x2="100" y2="165"
            gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#182538" />
            <stop offset="1" stop-color="#080d15" />
        </linearGradient>
    </defs>

    <!-- Kuadran 1 -->
    <path d="M50,50 L50,5 A45,45 0 0,1 95,50 Z" fill="#EA4335" />

    <!-- Kuadran 2 -->
    <path d="M50,50 L95,50 A45,45 0 0,1 50,95 Z" fill="#4285F4" />

    <!-- Kuadran 3 -->
    <path d="M50,50 L50,95 A45,45 0 0,1 5,50 Z" fill="#34A853" />

    <!-- Kuadran 4 -->
    <path d="M50,50 L5,50 A45,45 0 0,1 50,5 Z" fill="#FBBC05" />

    <!-- Garis Tengah -->
    <circle
        cx="50"
        cy="50"
        r="45"
        stroke="rgb(27 40 56)"
        stroke-width="2"
        fill="none"
    />

    <!-- Mask Shape -->
    <path
        d="M80 50 A30 30 0 1 1 20 50 A30 30 0 1 1 80 50Z"
        fill="url(#grad2)"
        stroke="whitesmoke"
        stroke-width="2"
    />

    <!-- Haxor Lock Icon -->
    <g transform="translate(30, 30) scale(0.2)">
        <!-- Background Persegi -->
        <rect
            x="0"
            y="0"
            width="200"
            height="200"
            fill="transparent"
            rx="20"
        />

        <!-- Handle Gembok -->
        <path
            d="M66.1,128.1V59.9c0-18.4,14.9-33.3,33.3-33.3s33.3,14.9,33.3,33.3v36.8"
            style="fill:none;stroke:whitesmoke;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:10;"
        />

        <!-- Badan Gembok -->
        <g id="lock-body" transform="translate(0 -22)">
            <rect
                x="59"
                y="117.5"
                width="14.5"
                height="4.7"
                style="opacity:0.6;fill:grey;"
            />

            <path
                d="M49.8,175.7c0,3.9,3.1,7,7,7H142c3.8,0,7-3.1,7-7v-48.3c0-3.8-3.2-7-7-7H56.8c-3.9,0-7,3.2-7,7V175.7z"
                style="fill:hsl(217, 83%, 50%);"
            />

            <!-- Lubang Kunci -->
            <g id="network">
                <g transform="translate(100 149) scale(0.72) translate(-100 -136)">
                    <path
                        d="M100 112
                           C91.7 112 85 118.7 85 127
                           C85 133 88.5 138.1 93.5 140.5
                           L90.5 157
                           Q90 160 93 160H107
                           Q110 160 109.5 157
                           L106.5 140.5
                           C111.5 138.1 115 133 115 127
                           C115 118.7 108.3 112 100 112Z"
                        fill="url(#keyholeShade)"
                    />

                    <!-- Highlight Lubang Kunci -->
                    <path
                        d="M95 119 C92.5 121 91.5 124 92 127"
                        stroke="#52647b"
                        stroke-width="2"
                        stroke-linecap="round"
                        opacity=".8"
                    />
                </g>
            </g>
        </g>
    </g>

    <!-- Circuit Details -->
    <line x1="50" y1="20" x2="50" y2="9" stroke="whitesmoke" stroke-width="2" />
    <circle cx="50" cy="8" r="2" fill="whitesmoke" />

    <line x1="80" y1="50" x2="93" y2="50" stroke="whitesmoke" stroke-width="2" />
    <circle cx="92" cy="50" r="2" fill="whitesmoke" />

    <line x1="20" y1="50" x2="7" y2="50" stroke="whitesmoke" stroke-width="2" />
    <circle cx="8" cy="50" r="2" fill="whitesmoke" />

    <line x1="50" y1="93" x2="50" y2="80" stroke="whitesmoke" stroke-width="2" />
    <circle cx="50" cy="92" r="2" fill="whitesmoke" />
</svg>